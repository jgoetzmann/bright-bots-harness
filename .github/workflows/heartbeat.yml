# heartbeat.yml: weekly, post one comment to the tracking issue with the queue, the last observed
# subscription usage and the fork state. Spends nothing: fake backend, no model call, no secret
# beyond GITHUB_TOKEN. A missing weekly comment is the alarm (B144).
name: heartbeat

on:
  schedule:
    - cron: "5 9 * * 1"           # B124: non-zero, non-round minute
  workflow_dispatch: {}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  beat:
    name: heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 120          # B125
    permissions:
      contents: read
      issues: write               # one comment on the tracking issue
      actions: read               # last successful run per workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install harness
        shell: bash
        run: python -m pip install -e .

      # Tier 0, fake backend, sqlite store: nothing here can authenticate or spend.
      - name: Write a read-only .env
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, re
          src = pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines()
          over = {
              "BACKEND": "fake",
              "PERMISSION_TIER": "0",
              "STORE_BACKEND": "sqlite",
              "HARNESS_GITHUB_TOKEN": "",
              "ANTHROPIC_API_KEY": "",
              "MAX_CONCURRENT_ITEMS": "1",
          }
          out, seen = [], set()
          for line in src:
              m = re.match(r"^([A-Z0-9_]+)=", line)
              if m and m.group(1) in over:
                  out.append(f"{m.group(1)}={over[m.group(1)]}")
                  seen.add(m.group(1))
              else:
                  out.append(line)
          for k, v in over.items():
              if k not in seen:
                  out.append(f"{k}={v}")
          pathlib.Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
          print("read-only .env written")
          PY

      # The live ledger is on `harness-state`; the checkout holds only main's seed. It is read
      # through the contents API, as the spending workflows read .harness/HALT, so no git
      # credentials are needed (B402).
      - name: Load state/ledger.json from harness-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          mkdir -p state runs/heartbeat
          # curl prints `000` itself when it cannot connect and then exits non-zero, so the
          # fallback sits outside the substitution (B408).
          code="$(curl -sS -o state/ledger.json.new -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${REPO}/contents/state/ledger.json?ref=harness-state")" || true
          code="${code:-000}"
          why=""
          if [ "${code}" != "200" ]; then
            why="HTTP ${code}"
          elif ! python -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' state/ledger.json.new 2>/dev/null; then
            why="HTTP 200 but not valid JSON"
          fi
          if [ -z "${why}" ]; then
            mv state/ledger.json.new state/ledger.json
            echo "harness-state" > runs/heartbeat/ledger-source
            echo "ledger loaded from harness-state"
          else
            rm -f state/ledger.json.new
            echo "the checked-in seed (harness-state unreadable: ${why})" > runs/heartbeat/ledger-source
            echo "::warning::could not read state/ledger.json from harness-state (${why}); reporting the checked-in seed"
          fi

      - name: harness status --json and harness ledger --json
        shell: bash
        run: |
          mkdir -p runs/heartbeat
          harness ledger --json > runs/heartbeat/ledger.json 2>runs/heartbeat/ledger.err || echo "harness ledger --json exited non-zero (see ledger.err); continuing"
          harness status --json > runs/heartbeat/status.json 2>runs/heartbeat/status.err || echo "harness status --json exited non-zero (see status.err); continuing"
          echo "ledger --json bytes: $(wc -c < runs/heartbeat/ledger.json)"
          echo "status --json bytes: $(wc -c < runs/heartbeat/status.json)"

      - name: Post the heartbeat comment
        uses: actions/github-script@v7
        env:
          TRACKING_ISSUE: ${{ vars.TRACKING_ISSUE }}
          FORK_REPO: ${{ vars.FORK_REPO }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch (e) { return ''; } };
            const parse = (t) => { try { return JSON.parse(t); } catch (e) { return null; } };
            const cfg = parse(read('.harness/config.json')) || {};
            // Loaded from harness-state by the step above; `ledger-source` says whether it was.
            const ledger = parse(read('state/ledger.json')) || {};
            const ledgerSource = read('runs/heartbeat/ledger-source').trim() || 'unknown';
            const ledgerCli = read('runs/heartbeat/ledger.json').trim();
            const statusCli = read('runs/heartbeat/status.json').trim();

            // The repository's one precedence rule (.harness/README.md): the committed
            // .harness/config.json wins, and a repository variable fills a knob only where that
            // file leaves it empty. The spending workflows apply it in their .env writer.
            const cfgTracking = (cfg.TRACKING_ISSUE === null || cfg.TRACKING_ISSUE === undefined)
              ? '' : String(cfg.TRACKING_ISSUE).trim();
            const trackingRaw = cfgTracking || (process.env.TRACKING_ISSUE || '').trim();
            const tracking = parseInt(trackingRaw, 10);
            if (!Number.isFinite(tracking) || tracking <= 0) {
              core.setFailed('TRACKING_ISSUE is not set (.harness/config.json, or repository variable TRACKING_ISSUE where the file leaves it empty): the heartbeat has nowhere to post (§16 item 12)');
              return;
            }
            const forkRepo = (cfg.FORK_REPO || '').trim() || (process.env.FORK_REPO || '').trim();
            const upstreamRepo = cfg.UPSTREAM_REPO || 'Bright-Bots-Initiative/brightboost';

            // Queue depth per stage label (open issues; PRs excluded).
            const labels = [
              'stage:queued', 'stage:planning', 'stage:needs-approval', 'stage:ready',
              'stage:building', 'stage:packaged', 'stage:needs-review', 'stage:revising',
              'stage:done', 'stage:blocked', 'stage:needs-human', 'stage:dropped',
            ];
            const depth = {};
            for (const label of labels) {
              const items = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: label, per_page: 100,
              });
              depth[label] = items.filter(i => !i.pull_request).length;
            }

            // last successful run of each workflow
            const lastSuccess = {};
            for (const wf of ['discover.yml', 'implement.yml', 'feedback.yml', 'heartbeat.yml']) {
              try {
                const r = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: wf, status: 'success', per_page: 1 });
                const last = r.data.workflow_runs[0];
                lastSuccess[wf] = last ? `${last.updated_at} ([run](${last.html_url}))` : 'never';
              } catch (e) {
                lastSuccess[wf] = `unknown (${e.message})`;
              }
            }

            // fork divergence from upstream (read-only compare; B105)
            let divergence = 'FORK_REPO not configured';
            if (forkRepo) {
              try {
                const [uo, ur] = upstreamRepo.split('/');
                const [fo, fr] = forkRepo.split('/');
                const up = await github.rest.repos.get({ owner: uo, repo: ur });
                const fk = await github.rest.repos.get({ owner: fo, repo: fr });
                const cmp = await github.rest.repos.compareCommitsWithBasehead({
                  owner: uo, repo: ur, basehead: `${up.data.default_branch}...${fo}:${fk.data.default_branch}`,
                });
                divergence = `${cmp.data.status}: fork \`${forkRepo}\` is ${cmp.data.ahead_by} ahead / ${cmp.data.behind_by} behind upstream \`${upstreamRepo}:${up.data.default_branch}\``
                  + (cmp.data.ahead_by > 0 ? ' — **fork default branch has diverged; sync-fork will refuse (B105)**' : '');
              } catch (e) {
                divergence = `could not compare ${forkRepo} with ${upstreamRepo} (${e.message})`;
              }
            }

            const w = ledger.window || {};
            const fmt = (v) => (v === undefined ? '?' : v === null ? 'null' : String(v));
            const lines = [];
            lines.push(`## harness heartbeat — ${new Date().toISOString()}`);
            lines.push(`run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`);
            lines.push('');
            // The kill switch goes first: while it is on, every spending workflow exits 0 before
            // doing anything, so a comment asking for work is read and silently ignored.
            const halted = fs.existsSync('.harness/HALT');
            if (halted) {
              lines.push('> ### The kill switch is ON');
              lines.push('>');
              lines.push('> `.harness/HALT` exists on `main`, so every spending workflow exits before it does anything. **Comments asking for work will be read and silently ignored.** Deleting that file, in one commit, resumes.');
              lines.push('');
            }
            // Maintainers look here first, so the comment links the inbox and the maintainer guide.
            const inboxRaw = (cfg.INBOX_ISSUE ?? '').toString().trim();
            const inbox = parseInt(inboxRaw, 10);
            if (Number.isFinite(inbox) && inbox > 0) {
              lines.push(`**Want it to do something?** Comment \`/harness work <what>\` on [the inbox](${context.serverUrl}/${owner}/${repo}/issues/${inbox}). New here: [docs/FOR-MAINTAINERS.md](${context.serverUrl}/${owner}/${repo}/blob/main/docs/FOR-MAINTAINERS.md).`);
              lines.push('');
            }
            lines.push('### queue depth (open issues per stage label)');
            lines.push('| stage | count |');
            lines.push('|---|---|');
            for (const l of labels) lines.push(`| \`${l}\` | ${depth[l]} |`);
            lines.push('');

            // window.usage is the last rate_limit_event the runner saw; it may be absent.
            const usage = w.usage || null;
            const pct = (u) =>
              (u && typeof u.utilization === 'number' ? `${Math.round(u.utilization * 1000) / 10}%` : '?');
            // A reading observed before `period_start` belongs to the previous window; the
            // ledger's own accessors drop it, and so does this.
            const stale = usage && usage.observed_at && w.period_start
              && String(usage.observed_at) < String(w.period_start);
            const room = (u, stop) =>
              (u && typeof u.utilization === 'number' && typeof stop === 'number')
                ? `${Math.round((stop - u.utilization * 100) * 10) / 10} points to go`
                : 'unknown';
            // A reading describes its window until that window resets (B399).
            const over = (u) => !!(u && u.resets_at && Date.parse(u.resets_at) <= Date.now());
            const overNote = (u) => (over(u) ? ' — **that window has reset since**; this reading no longer stops anything' : '');
            lines.push('### allowance (shared with everything else this account does)');
            lines.push(`- ledger read from: ${ledgerSource}`);
            if (usage && !stale) {
              const week = usage.seven_day || {};
              const session = usage.five_hour || {};
              lines.push(`- this week: ${pct(week)} used — ${room(week, Number(cfg.WEEKLY_USAGE_STOP_PCT))} before the ${fmt(cfg.WEEKLY_USAGE_STOP_PCT)}% stop; resets ${fmt(week.resets_at)}${overNote(week)}`);
              lines.push(`- this session: ${pct(session)} used — ${room(session, Number(cfg.SESSION_USAGE_STOP_PCT))} before the ${fmt(cfg.SESSION_USAGE_STOP_PCT)}% stop; resets ${fmt(session.resets_at)}${overNote(session)}`);
              lines.push(`- status: ${fmt(usage.status)}, observed ${fmt(usage.observed_at)}`);
            } else if (stale) {
              lines.push(`- not measured yet this window: the last reading (${fmt(usage.observed_at)}) predates ${fmt(w.period_start)}, so it is last window's and is not shown.`);
            } else {
              lines.push('- not measured yet: no `rate_limit_event` has been recorded.');
            }
            lines.push(`- run window: ${fmt(cfg.RUN_WINDOW_START)} → ${fmt(cfg.RUN_WINDOW_END)} UTC; carry leeway OVERRUN_PCT ${fmt(cfg.OVERRUN_PCT)}%`);
            const carry = w.carry || null;
            lines.push(carry
              ? `- carried item: #${fmt(carry.issue)} since ${fmt(carry.since)} — ${fmt(carry.reason)}`
              : '- carried item: none');
            lines.push(`- model calls since ${fmt(w.period_start)}: ${fmt(w.calls)}`);
            lines.push(`- rate_limited_until: ${fmt(w.rate_limited_until)}`);
            lines.push(`- history entries: ${Array.isArray(ledger.history) ? ledger.history.length : '?'}`);
            lines.push('');
            lines.push('### last successful run');
            for (const [k, v] of Object.entries(lastSuccess)) lines.push(`- ${k}: ${v}`);
            lines.push('');
            lines.push('### fork vs upstream');
            lines.push(`- ${divergence}`);
            if (ledgerCli) {
              lines.push('', '<details><summary>harness ledger --json</summary>', '', '```json', ledgerCli.slice(0, 6000), '```', '</details>');
            }
            if (statusCli) {
              lines.push('', '<details><summary>harness status --json (runner-local view)</summary>', '', '```json', statusCli.slice(0, 6000), '```', '</details>');
            }
            lines.push('', '_Absence of this weekly comment is the alarm (B144)._');

            await github.rest.issues.createComment({ owner, repo, issue_number: tracking, body: lines.join('\n') });
            core.info(`heartbeat posted to #${tracking}`);
