# ops.yml — on a failed spending run: open or update the ops issue, retry transient causes up to twice.
# Spends nothing. Handoff §11.2 (B145, B146); RUN-DECISIONS-D2 §15.
# The harness package may not shell out to `gh`; a workflow may use actions/github-script, and this one does.
name: ops

on:
  workflow_run:
    workflows: [discover, implement, feedback]
    types: [completed]

env:
  PYTHONUTF8: "1"

jobs:
  # An ops issue is opened by a failure and, until now, closed by nobody. They accumulated: a
  # workflow that failed once in August still had an open issue in September, long after the
  # cause was fixed, and the pile made the real ones harder to see. A green run of the same
  # workflow is the most reliable evidence its ops issue is stale, and it costs one API call.
  recovered:
    name: ops recovered
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Close the ops issue for a workflow that is green again
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const title = `ops: ${run.name} failed`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'kind:ops', per_page: 100,
            });
            const stale = open.filter(i => !i.pull_request && i.title === title);
            if (stale.length === 0) {
              core.info(`no open ops issue titled ${JSON.stringify(title)}`);
              return;
            }

            for (const issue of stale) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  `Closed automatically: **${run.name}** completed successfully.`,
                  ``,
                  `- recovering run: ${run.html_url} (event \`${run.event}\`, sha \`${run.head_sha}\`)`,
                  ``,
                  `A green run is evidence the cause is gone, not proof it was understood. If this`,
                  `failure mattered, the diagnosis belongs in a commit or a decision record rather`,
                  `than an open issue — reopen this one if it recurs, and the next failure opens a`,
                  `fresh issue in any case.`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
              core.info(`closed ops issue #${issue.number}`);
            }

  triage:
    name: ops triage
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 120          # B125
    permissions:
      contents: read
      issues: write               # the ops issue and its comments/labels
      actions: write              # read jobs and logs of the failed run; re-run failed jobs
    steps:
      - name: Alert and bounded retry
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const wfName = run.name;
            const attempt = run.run_attempt || 1;

            // Three attempts, so two automatic retries. One was not enough: the failures that
            // actually happen here are network and registry blips, and those cluster -- a
            // single retry lands inside the same bad minute often enough to be no retry at all.
            //
            // Counted from `run_attempt`, which GitHub increments, rather than from a label on
            // the ops issue. The label version capped retries per ISSUE, so one transient
            // failure in August spent the retry for every failure of that workflow afterwards,
            // until a human closed the issue. Nobody did.
            //
            // What this does NOT loosen is the model-and-gate rule below. Those cost money and
            // fail for reasons a retry cannot fix, so they still never retry at all.
            const MAX_ATTEMPTS = 3;

            // --- what failed -------------------------------------------------------------
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const failedJob =
              jobs.find(j => j.conclusion === 'failure') ||
              jobs.find(j => j.conclusion && !['success', 'skipped', 'neutral'].includes(j.conclusion)) ||
              null;
            let failingStep = '(none identified)';
            if (failedJob) {
              const s = (failedJob.steps || []).find(st => st.conclusion === 'failure');
              if (s) failingStep = s.name;
            }

            // --- last 50 log lines, redacted ---------------------------------------------
            const redact = (line) => line
              .replace(/gh[pousr]_[A-Za-z0-9]{20,}/g, '[REDACTED:token]')
              .replace(/github_pat_[A-Za-z0-9_]{20,}/g, '[REDACTED:token]')
              .replace(/sk-ant-[A-Za-z0-9_\-]{20,}/g, '[REDACTED:key]')
              .replace(/(Authorization\s*:\s*)(Bearer|token|Basic)\s+\S+/gi, '$1$2 [REDACTED]')
              .replace(/(https?:\/\/)[^\/\s:@]+:[^@\s]+@/g, '$1[REDACTED]@')
              .replace(/([A-Z0-9_]*(TOKEN|SECRET|PASSWORD|API_KEY)[A-Z0-9_]*\s*=\s*)\S+/g, '$1[REDACTED]');
            let tail = '(log unavailable)';
            if (failedJob) {
              try {
                const r = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: failedJob.id });
                const text = typeof r.data === 'string' ? r.data : Buffer.from(r.data).toString('utf8');
                const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                tail = lines.slice(-50).map(redact).join('\n');
              } catch (e) {
                tail = `(log unavailable: ${e.message})`;
              }
            }

            // --- classification (B146) ---------------------------------------------------
            // An ALLOW-LIST, and the difference matters more than it looks.
            //
            // `reRunWorkflowRunFailedJobs` re-runs the whole JOB, and all three spending
            // workflows are a single job. So "did the failing STEP spend?" is the wrong
            // question -- the right one is "had the job spent anything by the time it failed?",
            // because a re-run starts at the top and does it all again.
            //
            // The step that makes a run durable, `Commit state/ledger.json`, runs AFTER the
            // spend and matches no model-or-gate pattern. A denial list let it through: a push
            // to `harness-state` losing its connection meant a retry that reloaded the
            // PRE-RUN ledger, found the same comment unseen (B135's guard lives in
            // `seen_comment_ids`, which only reaches the branch through that push), and paid
            // for the same model call a second time -- invisibly to WEEKLY_CAP_USD, because the
            // ledger recording the first attempt was exactly what failed to save.
            //
            // So: retry only steps known to run before anything is spent. Anything else, named
            // or not, is left for a human. A step added later is not retried until somebody
            // decides it is safe, which is the right default for a workflow that spends money.
            //
            // This is B146 made stronger, not replaced. B146's rule was "never retry a failure
            // inside a model call or a gate" -- a red gate is information, not a transient, and
            // `revise` and `propose` fail for reasons a retry cannot fix. Everything that rule
            // refused, this refuses; what it adds is everything that runs AFTER those, which the
            // old word list could not see.
            // Every one of these is a real step name from discover.yml, implement.yml and
            // feedback.yml, and every step in those three files is classified one way or the
            // other by a test -- so a step added later fails the suite until somebody decides
            // which side it is on, rather than defaulting to "retry a job that spends".
            const RETRYABLE_STEPS = [
              'HALT check (.harness/HALT on the default branch)',
              'Checkout',
              'Load state/ledger.json from harness-state',
              'Set up Python 3.13',
              'Set up Node',
              'Install harness and the claude CLI',
              'Write .env from .env.example and repository configuration',
              'harness doctor',
              'harness sync-fork',
              'Note a stale fork',
              'Approve merged proposals (push to proposals/**)',
              'harness dispatch',
            ];
            const preSpend = RETRYABLE_STEPS.includes(failingStep);
            // Kept under its old name because the message below reads better for the case it
            // actually describes, which is still the commonest reason a step is not retryable.
            const modelOrGate = !preSpend;
            const transientRe = new RegExp([
              'ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND', 'socket hang up',
              'npm ERR! (network|fetch|ERR_SOCKET|E5\\d\\d)', 'registry\\.npmjs\\.org.*\\b5\\d\\d\\b',
              'Internal Server Error', 'Bad Gateway', 'Service Unavailable', 'Gateway Time-?out',
              'HTTP(S)?\\s*5\\d\\d', 'status(:| code)?\\s*5\\d\\d',
              'received a shutdown signal', 'lost communication with the server', 'runner has been evicted',
              'Connection reset by peer', 'TLS handshake timeout', 'Could not resolve host',
              'Temporary failure in name resolution',
            ].join('|'), 'i');
            const transient = !modelOrGate && transientRe.test(tail);

            // --- the ops issue: open or update ------------------------------------------
            const title = `ops: ${wfName} failed`;
            const ensureLabel = async (name, color, description) => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { if (e.status === 404) await github.rest.issues.createLabel({ owner, repo, name, color, description }); else throw e; }
            };
            // D4/B264: `kind:ops` is the D4 name, and its colour and description match LABEL_SPECS
            // so `harness init --labels` and this workflow cannot disagree about it.
            await ensureLabel('kind:ops', 'e11d21', 'a failed run');
            // `ensureLabel` only CREATES a missing label, so a description changed here never
            // reaches a label that already exists. Left accurate for a fresh repository; the
            // live one carries the old wording and the issue body is the authority anyway.
            await ensureLabel('retried', 'fbca04', 'harness: automatically retried at least once');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'kind:ops', per_page: 100,
            });
            let issue = open.find(i => !i.pull_request && i.title === title) || null;
            // A MARKER, not a gate: it says "this has been retried at least once" to anybody
            // scanning the issue list. The cap itself is `run_attempt` above.
            const alreadyRetried = !!(issue && issue.labels.some(l => (l.name || l) === 'retried'));

            const willRetry = transient && attempt < MAX_ATTEMPTS;

            let action;
            if (willRetry) {
              action = `transient failure on attempt ${attempt} of ${MAX_ATTEMPTS}: re-dispatching the failed jobs (attempt ${attempt + 1}).`;
            } else if (transient) {
              action = `transient failure on attempt ${attempt}: ${MAX_ATTEMPTS} attempts is the cap; left for a human.`;
            } else if (modelOrGate) {
              action = `failure inside "${failingStep}", which is not on the list of steps known to run before anything is spent: a re-run would redo the whole job, so this is left for a human (B146).`;
            } else {
              action = 'not classified as transient: left for a human.';
            }

            const body = [
              `## ${title}`,
              ``,
              `- run: ${run.html_url} (attempt ${attempt}, event \`${run.event}\`, branch \`${run.head_branch}\`, sha \`${run.head_sha}\`)`,
              `- failing job: ${failedJob ? `${failedJob.name} (${failedJob.html_url})` : '(none identified)'}`,
              `- failing step: ${failingStep}`,
              `- classification: ${transient ? 'transient' : 'not transient'}`,
              `- failing step runs before any spend: ${preSpend ? 'yes' : 'no'}`,
              `- attempts: ${attempt} of ${MAX_ATTEMPTS}${alreadyRetried ? ' (this issue has seen a retry before)' : ''}`,
              `- action: ${action}`,
              ``,
              `<details><summary>last 50 log lines (redacted)</summary>`,
              ``,
              '```',
              tail,
              '```',
              `</details>`,
              ``,
              `_See docs/OPERATIONS.md. Close this issue once handled; the next failure opens a fresh one._`,
            ].join('\n');

            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              core.info(`updated ops issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['kind:ops'] });
              issue = created.data;
              core.info(`opened ops issue #${issue.number}`);
            }

            // --- bounded retry (B145 step 2, B146) --------------------------------------
            if (willRetry) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['retried'] });
              await github.rest.actions.reRunWorkflowRunFailedJobs({ owner, repo, run_id: run.id });
              core.info(`re-dispatched failed jobs of run ${run.id} (attempt ${attempt + 1} of ${MAX_ATTEMPTS})`);
            }
