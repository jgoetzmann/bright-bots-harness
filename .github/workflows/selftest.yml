# selftest.yml — on every pull request here: the whole suite under BACKEND=fake on Linux and Windows.
# Uses no secrets; the only workflow that runs on pull requests, so a fork PR is safe by construction.
# Handoff §7.3 (B129, B130); RUN-DECISIONS-D2 §15.
name: selftest

on:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  BACKEND: fake
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120          # B125
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install with dev extras
        shell: bash
        run: python -m pip install -e ".[dev]"

      - name: Verify the pin (when present)
        shell: bash
        run: |
          if [ -f .harness/PIN ]; then
            python -m harness.verify_pin --check
          else
            echo "no .harness/PIN yet; skipping the pin check"
          fi

      - name: pytest (BACKEND=fake)
        shell: bash
        run: python -m pytest -q
