# implement.yml: five passes inside the daily run window, on dispatch, and on a merged proposal,
# drain the approved queue. Spends subscription capacity. Step order: HALT check,
# checkout/setup, doctor, sync-fork, dispatch, work, ledger, artifacts, after a `quiet` job
# that waits until nobody else is using the subscription (D93), then a `relay` job that arms
# resume.yml for the next time something could start (D95).
name: implement

on:
  schedule:
    # The run window is daily 01:30 to 06:30 UTC, opening half an hour before the JackiOh night
    # bot's shared-subscription hours (21:00 America/Chicago), so the harness starts first
    # (D95). A scheduled run carries its window with it however late GitHub delivers it, since
    # every firing sits inside the window (B412), and resume.yml starts the 01:30 run on time.
    # Hourly firings because GitHub delivers scheduled runs late and drops some (D80).
    # DST: GitHub cron is always UTC; 01:30 UTC is 20:30 CDT, and 19:30 CST after the clocks
    # change, an hour more of head start.
    - cron: "31 1-5 * * *"        # 01:31 through 05:31 UTC, hourly, every day
  workflow_dispatch:
    inputs:
      issue:
        description: "issue number, or blank for the dispatcher's plan"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["proposals/**"]       # a merged proposal = approval (gate 1)

# Every workflow that writes state/ledger.json shares one group and never cancels a run (B118).
concurrency:
  group: harness-ledger
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # D93: the wait for a quiet subscription is a job of its own, since it can outlast the
  # 120 minutes a spending job may run (B125). It plans as the spending job does, waits,
  # and commits what it read; the spending job starts only on its `quiet` output.
  quiet:
    name: quiet
    runs-on: ubuntu-latest
    timeout-minutes: 140          # D93: the longest wait (120), one more pair, and setup
    permissions:
      contents: write             # read .harness/HALT; push the ledger commit. Issue/PR writes use the machine account's PAT via .env, never this token.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # B128: passed through to the claude CLI
    outputs:
      quiet: ${{ steps.quiet.outputs.quiet }}
    steps:
        # The first step of every spending job, before checkout, doctor and the dispatcher (B149).
      - name: HALT check (.harness/HALT on the default branch)
        id: halt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          mkdir -p .harness
          code="$(curl -sS -o .harness/HALT -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${REPO}/contents/.harness/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" != "200" ]; then rm -f .harness/HALT; fi
          if test -f .harness/HALT; then
            echo "halted by .harness/HALT"
            echo "halted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "halted=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.halt.outputs.halted != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

        # The ledger lives on the unprotected `harness-state` branch, because main requires a
        # reviewed PR and the Actions token commits directly (D28).
      - name: Load state/ledger.json from harness-state
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git fetch --quiet origin harness-state 2>/dev/null; then
            mkdir -p state
            # Written to a temporary file first: a redirect truncates its target before git runs.
            git show FETCH_HEAD:state/ledger.json > state/ledger.json.new
            mv state/ledger.json.new state/ledger.json
            echo "ledger loaded from harness-state"
          else
            echo "no harness-state branch yet; using the checked-in ledger"
          fi

      - name: Set up Python 3.13
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install harness and the claude CLI
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          python -m pip install -e .
          npm i -g @anthropic-ai/claude-code
          claude --version

      - name: Write .env from .env.example and repository configuration
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        env:
          HARNESS_GITHUB_TOKEN: ${{ secrets.HARNESS_GITHUB_TOKEN }}
          FORK_REPO: ${{ vars.FORK_REPO }}
          SELF_REPO: ${{ github.repository }}
          TRACKING_ISSUE: ${{ vars.TRACKING_ISSUE }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          src = pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines()
          env = os.environ
          over = {
              "BACKEND": "cli",
              "PERMISSION_TIER": "2",
              "STORE_BACKEND": "github",
              "HARNESS_GITHUB_TOKEN": env.get("HARNESS_GITHUB_TOKEN", ""),
              "FORK_REPO": env.get("FORK_REPO", ""),
              "SELF_REPO": env.get("SELF_REPO", ""),
              "TRACKING_ISSUE": env.get("TRACKING_ISSUE", ""),
              "ANTHROPIC_API_KEY": "",
          }
          out, seen = [], set()
          for line in src:
              m = re.match(r"^([A-Z0-9_]+)=", line)
              if m and m.group(1) in over:
                  out.append(f"{m.group(1)}={over[m.group(1)]}")
                  seen.add(m.group(1))
              else:
                  out.append(line)
          for k, v in over.items():
              if k not in seen:
                  out.append(f"{k}={v}")
          pathlib.Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
          # Repository variables fill .harness/config.json only where the committed file leaves a knob empty.
          cfg_path = pathlib.Path(".harness/config.json")
          if cfg_path.exists():
              cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
              changed = False
              if not cfg.get("FORK_REPO") and over["FORK_REPO"]:
                  cfg["FORK_REPO"] = over["FORK_REPO"]
                  changed = True
              if cfg.get("TRACKING_ISSUE") in (None, "") and over["TRACKING_ISSUE"]:
                  cfg["TRACKING_ISSUE"] = int(over["TRACKING_ISSUE"])
                  changed = True
              if changed:
                  cfg_path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          keys = [m.group(1) for m in (re.match(r"^([A-Z0-9_]+)=", l) for l in out) if m]
          print(".env written; keys:", " ".join(keys))
          PY

        # B127: verify the environment before spending anything.
      - name: harness doctor
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: harness doctor

        # Gate 1, reconciled rather than read off a push diff. GitHub keeps one run in progress
        # and one pending per concurrency group, so a burst of merges cancels the pending runs —
        # and a diff exists only inside the event that carried it, so each cancelled run took
        # the only copy of its own approval with it. The committed proposal file is the durable
        # record (D46), so this runs on EVERY run and any later one repairs what a cancelled run
        # never did (D78). Only `proposed -> approved` is ever made, so nothing is resurrected.
      - name: Approve merged proposals (every proposal on main)
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: harness approve --merged

        # The dispatcher starts nothing; this job acts on its plan (B122). A scheduled run's
        # firing sat inside the window, so it plans as though the window were open (D95).
      - name: harness dispatch
        if: steps.halt.outputs.halted != 'true'
        id: dispatch
        shell: bash
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          mkdir -p runs
          plan="$(harness dispatch --owe ${SCHEDULED:+--scheduled})"
          printf '%s\n' "$plan" | tee runs/dispatch-plan.json
          if ! printf '%s' "$plan" | jq -e 'has("start")' >/dev/null 2>&1; then
            echo "dispatch produced no plan (output above); nothing to start"
            echo "items=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          items="$(printf '%s' "$plan" | jq -r '.start[]' | tr '\n' ' ')"
          echo "items=${items}" >> "$GITHUB_OUTPUT"
          echo "plan: start=[${items}] reason=$(printf '%s' "$plan" | jq -r '.reason')"

        # D93: nothing starts while somebody else is using the subscription, or once the run window
        # has closed during the wait. It pings only when there is something to start; an `issue`
        # input, or an item forced with `--force`, is the operator asking now and skips the wait.
      - name: Wait until the subscription is quiet (harness quiet)
        if: steps.halt.outputs.halted != 'true'
        id: quiet
        shell: bash
        env:
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          PLAN_ITEMS: ${{ steps.dispatch.outputs.items }}
        run: |
          set -euo pipefail
          mkdir -p runs
          items="${INPUT_ISSUE:-${PLAN_ITEMS}}"
          if [ -z "${items// }" ]; then
            echo "nothing to start; no quiet check"
            echo "quiet=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${INPUT_ISSUE// }" ]; then
            args=(--force)
          else
            args=(--window --items ${items})
          fi
          harness --json quiet "${args[@]}" | tee runs/quiet.json
          if [ "$(jq -r '.quiet' runs/quiet.json)" = "true" ]; then
            echo "quiet=true" >> "$GITHUB_OUTPUT"
          else
            echo "not quiet: $(jq -r '.reason' runs/quiet.json)"
            echo "quiet=false" >> "$GITHUB_OUTPUT"
          fi

        # Commits what the check read, with [skip ci]; runs even when it failed, never when halted.
      - name: Commit state/ledger.json
        if: always() && steps.halt.outputs.halted != 'true'
        shell: bash
        env:
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: harness-state
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f state/ledger.json ]; then echo "no ledger file; nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A worktree holding only the state branch, so main's history never rides along (D28).
          rm -rf ../harness-state
          if git fetch --quiet origin "${BRANCH}" 2>/dev/null; then
            git worktree add --quiet ../harness-state FETCH_HEAD
          else
            git worktree add --quiet --orphan -b "${BRANCH}" ../harness-state
          fi
          mkdir -p ../harness-state/state
          if [ -f ../harness-state/state/ledger.json ] && cmp -s state/ledger.json ../harness-state/state/ledger.json; then
            echo "ledger unchanged; nothing to commit"
            exit 0
          fi
          cp state/ledger.json ../harness-state/state/ledger.json
          cd ../harness-state
          git add state/ledger.json && git commit --quiet -m "ledger: ${WORKFLOW} run ${RUN_ID} [skip ci]"
          # The checkout keeps no credential, so this token is never in .git/config for the model
          # or the product's code to find; it reaches git on this push's command line only (D96).
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          for attempt in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
                push --quiet origin "HEAD:refs/heads/${BRANCH}"; then
              echo "ledger pushed to ${BRANCH}"; exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${BRANCH}"
            git fetch --quiet origin "${BRANCH}"
            if ! git rebase --quiet "origin/${BRANCH}"; then
              git rebase --abort || true
              echo "::error::ledger rebase conflicted; run 'harness ledger --rebuild' and commit the result by hand (B117)"
              exit 1
            fi
          done
          echo "::error::could not push the ledger after 3 attempts"
          exit 1

        # B126: evidence survives a cancelled or timed-out run.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implement-quiet-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            runs/item-*/
            runs/dispatch-plan.json
            runs/quiet.json
            runs/**/*.md
            runs/**/*.json
            runs/**/*.jsonl
            runs/**/*.log
            runs/**/*.txt
            !runs/**/node_modules/**
            !runs/**/.git/**
            !runs/**/clone/**
            !runs/**/workspace/**

  implement:
    name: implement
    needs: quiet
    runs-on: ubuntu-latest
    timeout-minutes: 120          # B125
    permissions:
      contents: write             # read .harness/HALT; push the ledger commit. Issue/PR writes use the machine account's PAT via .env, never this token.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # B128: passed through to the claude CLI
    outputs:
      wake_at: ${{ steps.wake.outputs.at }}
      wake_reason: ${{ steps.wake.outputs.reason }}
    steps:
        # The first step of every spending job, before checkout, doctor and the dispatcher (B149).
      - name: HALT check (.harness/HALT on the default branch)
        id: halt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          mkdir -p .harness
          code="$(curl -sS -o .harness/HALT -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${REPO}/contents/.harness/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" != "200" ]; then rm -f .harness/HALT; fi
          if test -f .harness/HALT; then
            echo "halted by .harness/HALT"
            echo "halted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "halted=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.halt.outputs.halted != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

        # The ledger lives on the unprotected `harness-state` branch, because main requires a
        # reviewed PR and the Actions token commits directly (D28).
      - name: Load state/ledger.json from harness-state
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git fetch --quiet origin harness-state 2>/dev/null; then
            mkdir -p state
            # Written to a temporary file first: a redirect truncates its target before git runs.
            git show FETCH_HEAD:state/ledger.json > state/ledger.json.new
            mv state/ledger.json.new state/ledger.json
            echo "ledger loaded from harness-state"
          else
            echo "no harness-state branch yet; using the checked-in ledger"
          fi

      - name: Set up Python 3.13
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install harness and the claude CLI
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          python -m pip install -e .
          npm i -g @anthropic-ai/claude-code
          claude --version

      - name: Write .env from .env.example and repository configuration
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        env:
          HARNESS_GITHUB_TOKEN: ${{ secrets.HARNESS_GITHUB_TOKEN }}
          FORK_REPO: ${{ vars.FORK_REPO }}
          SELF_REPO: ${{ github.repository }}
          TRACKING_ISSUE: ${{ vars.TRACKING_ISSUE }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          src = pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines()
          env = os.environ
          over = {
              "BACKEND": "cli",
              "PERMISSION_TIER": "2",
              "STORE_BACKEND": "github",
              "HARNESS_GITHUB_TOKEN": env.get("HARNESS_GITHUB_TOKEN", ""),
              "FORK_REPO": env.get("FORK_REPO", ""),
              "SELF_REPO": env.get("SELF_REPO", ""),
              "TRACKING_ISSUE": env.get("TRACKING_ISSUE", ""),
              "ANTHROPIC_API_KEY": "",
          }
          out, seen = [], set()
          for line in src:
              m = re.match(r"^([A-Z0-9_]+)=", line)
              if m and m.group(1) in over:
                  out.append(f"{m.group(1)}={over[m.group(1)]}")
                  seen.add(m.group(1))
              else:
                  out.append(line)
          for k, v in over.items():
              if k not in seen:
                  out.append(f"{k}={v}")
          pathlib.Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
          # Repository variables fill .harness/config.json only where the committed file leaves a knob empty.
          cfg_path = pathlib.Path(".harness/config.json")
          if cfg_path.exists():
              cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
              changed = False
              if not cfg.get("FORK_REPO") and over["FORK_REPO"]:
                  cfg["FORK_REPO"] = over["FORK_REPO"]
                  changed = True
              if cfg.get("TRACKING_ISSUE") in (None, "") and over["TRACKING_ISSUE"]:
                  cfg["TRACKING_ISSUE"] = int(over["TRACKING_ISSUE"])
                  changed = True
              if changed:
                  cfg_path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          keys = [m.group(1) for m in (re.match(r"^([A-Z0-9_]+)=", l) for l in out) if m]
          print(".env written; keys:", " ".join(keys))
          PY

        # B127: verify the environment before spending anything.
      - name: harness doctor
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: harness doctor

        # B105: fast-forward only; a diverged fork fails the job here and pushes nothing.
      - name: harness sync-fork
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: harness sync-fork

        # Gate 1, reconciled rather than read off a push diff. GitHub keeps one run in progress
        # and one pending per concurrency group, so a burst of merges cancels the pending runs —
        # and a diff exists only inside the event that carried it, so each cancelled run took
        # the only copy of its own approval with it. The committed proposal file is the durable
        # record (D46), so this runs on EVERY run and any later one repairs what a cancelled run
        # never did (D78). Only `proposed -> approved` is ever made, so nothing is resurrected.
      - name: Approve merged proposals (every proposal on main)
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: harness approve --merged

        # The dispatcher starts nothing; this job acts on its plan (B122). A scheduled run's
        # firing sat inside the window, so it plans as though the window were open (D95).
      - name: harness dispatch
        if: steps.halt.outputs.halted != 'true'
        id: dispatch
        shell: bash
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          mkdir -p runs
          plan="$(harness dispatch --owe ${SCHEDULED:+--scheduled})"
          printf '%s\n' "$plan" | tee runs/dispatch-plan.json
          if ! printf '%s' "$plan" | jq -e 'has("start")' >/dev/null 2>&1; then
            echo "dispatch produced no plan (output above); nothing to start"
            echo "items=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          items="$(printf '%s' "$plan" | jq -r '.start[]' | tr '\n' ' ')"
          echo "items=${items}" >> "$GITHUB_OUTPUT"
          echo "plan: start=[${items}] reason=$(printf '%s' "$plan" | jq -r '.reason')"

        # harness run --item N implements, packages and (when the client can write) delivers the item.
      - name: Run planned items (harness run --item)
        if: steps.halt.outputs.halted != 'true' && needs.quiet.outputs.quiet == 'true'
        shell: bash
        env:
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          PLAN_ITEMS: ${{ steps.dispatch.outputs.items }}
        run: |
          set -euo pipefail
          items="${INPUT_ISSUE:-${PLAN_ITEMS}}"
          if [ -z "${items// }" ]; then
            echo "nothing to start"
            exit 0
          fi
          failed=0
          for n in ${items}; do
            echo "::group::harness run --item ${n}"
            if harness run --item "$n"; then
              echo "item ${n}: ok"
            else
              echo "::error::harness run --item ${n} exited non-zero"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

        # Commits the ledger with [skip ci]; runs even when an item failed, never when halted.
      - name: Commit state/ledger.json
        if: always() && steps.halt.outputs.halted != 'true'
        shell: bash
        env:
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: harness-state
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f state/ledger.json ]; then echo "no ledger file; nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A worktree holding only the state branch, so main's history never rides along (D28).
          rm -rf ../harness-state
          if git fetch --quiet origin "${BRANCH}" 2>/dev/null; then
            git worktree add --quiet ../harness-state FETCH_HEAD
          else
            git worktree add --quiet --orphan -b "${BRANCH}" ../harness-state
          fi
          mkdir -p ../harness-state/state
          if [ -f ../harness-state/state/ledger.json ] && cmp -s state/ledger.json ../harness-state/state/ledger.json; then
            echo "ledger unchanged; nothing to commit"
            exit 0
          fi
          cp state/ledger.json ../harness-state/state/ledger.json
          cd ../harness-state
          git add state/ledger.json && git commit --quiet -m "ledger: ${WORKFLOW} run ${RUN_ID} [skip ci]"
          # The checkout keeps no credential, so this token is never in .git/config for the model
          # or the product's code to find; it reaches git on this push's command line only (D96).
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          for attempt in 1 2 3; do
            if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
                push --quiet origin "HEAD:refs/heads/${BRANCH}"; then
              echo "ledger pushed to ${BRANCH}"; exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${BRANCH}"
            git fetch --quiet origin "${BRANCH}"
            if ! git rebase --quiet "origin/${BRANCH}"; then
              git rebase --abort || true
              echo "::error::ledger rebase conflicted; run 'harness ledger --rebuild' and commit the result by hand (B117)"
              exit 1
            fi
          done
          echo "::error::could not push the ledger after 3 attempts"
          exit 1

        # D95: when something could next start, for the relay job below. Reads only.
      - name: When to come back (harness wake)
        if: always() && steps.halt.outputs.halted != 'true'
        id: wake
        continue-on-error: true       # no alarm is a missed restart, not a failed run
        shell: bash
        run: |
          mkdir -p runs
          harness --json wake | tee runs/wake.json
          echo "at=$(jq -r '.at // empty' runs/wake.json)" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r '(.reason // "")[0:200]' runs/wake.json)" >> "$GITHUB_OUTPUT"

        # B126: evidence survives a cancelled or timed-out run.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implement-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            runs/item-*/
            runs/dispatch-plan.json
            runs/quiet.json
            runs/**/*.md
            runs/**/*.json
            runs/**/*.jsonl
            runs/**/*.log
            runs/**/*.txt
            !runs/**/node_modules/**
            !runs/**/.git/**
            !runs/**/clone/**
            !runs/**/workspace/**

  # D95: arms resume.yml with the time `harness wake` gave, so a run the usage stop, a rate
  # limit, a busy subscription or the window's end held back is followed by one that starts once
  # that clears. Holds no secret and no checkout, and takes seconds inside the workflow's lock;
  # implement.yml checks everything again. Only after a green job: a run that keeps failing must
  # not bring itself back every 20 minutes.
  relay:
    name: relay
    needs: implement
    if: success() && needs.implement.outputs.wake_at != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write              # list pending alarms; dispatch resume.yml
    steps:
      - name: Arm the resume relay
        uses: actions/github-script@v7
        env:
          AT: ${{ needs.implement.outputs.wake_at }}
          REASON: ${{ needs.implement.outputs.wake_reason }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = (context.payload.repository || {}).default_branch || 'main';
            // An alarm for the same workflow already pending at or before this time covers it:
            // the run it starts arms the next one. A title naming no workflow is an implement
            // alarm (D96).
            const ACTIVE = ['queued', 'requested', 'waiting', 'pending', 'in_progress'];
            const TITLE = /^resume\s+(?:(\S+\.yml)\s+)?at\s+(\S+)/;
            const alarms = [
              { workflow: 'implement.yml', at: process.env.AT, reason: process.env.REASON },
            ];
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'resume.yml', per_page: 50,
            });
            for (const alarm of alarms) {
              const at = Date.parse(alarm.at);
              const covered = (data.workflow_runs || []).some((run) => {
                const title = TITLE.exec(String(run.display_title || ''));
                if (!title || (title[1] || 'implement.yml') !== alarm.workflow) return false;
                const other = Date.parse(title[2]);
                return ACTIVE.includes(run.status) && !Number.isNaN(other) && other <= at;
              });
              if (covered) {
                core.info(`an alarm for ${alarm.workflow} at or before ${alarm.at} is pending`);
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'resume.yml', ref,
                inputs: {
                  at: alarm.at, workflow: alarm.workflow,
                  reason: (alarm.reason || '').slice(0, 200),
                },
              });
              core.info(`resume.yml armed for ${alarm.workflow} at ${alarm.at}`);
            }
