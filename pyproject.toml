[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bright-bots-harness"
version = "1.0.0"
description = "A locally-run, credential-free harness that takes work on the brightboost repository from discovery to a human-reviewable package."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Bright Bots" }]
keywords = ["harness", "agent", "review-package", "brightboost"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.13",
]

# Runtime dependencies: none, deliberately. A harness whose selling point is that it
# holds no credentials should not pull a supply chain to read a .env file.
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
harness = "harness.__main__:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
