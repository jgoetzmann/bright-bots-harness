# watchdog.yml: when feedback.yml's schedule has not fired, dispatch a run, and file an ops issue
# once the schedule has stopped. Spends nothing itself; feedback.yml applies its own halt, window
# and usage-stop checks (B294).
name: watchdog

on:
  schedule:
    # Offset from feedback's `41 */3 * * 1-5` in hour and minute, so one scheduler wedge is less
    # likely to swallow both. It runs at weekends only so Monday's first check is on time; the
    # weekday gate below stops it dispatching then.
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

env:
  PYTHONUTF8: "1"

# Outside the `harness-ledger` group: it writes no state and must not queue behind the run it
# is watching for.
concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  watch:
    name: watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write              # read run history; dispatch feedback.yml
      issues: write               # the ops issue, when it is a pattern rather than a hiccup
    steps:
      - name: Start feedback if nothing has swept in too long
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const WORKFLOW = 'feedback.yml';

            // feedback runs every 3h on weekdays, so six hours means two consecutive runs are
            // missing. GitHub often runs a cron minutes late, so a tighter threshold would
            // dispatch on lateness alone.
            const STALE_HOURS = 6;
            // A stoppage is four missed weekday slots. Counted in slots because the schedule is
            // `1-5`: Friday 21:41 to Monday 00:41 has none, and an hours threshold would fire
            // every Monday.
            const DEAD_SLOTS = 4;

            const now = new Date();
            const weekday = (d) => d.getUTCDay() >= 1 && d.getUTCDay() <= 5;

            // Not `paginate`: the endpoint lists newest first, and the last 100 runs answer both
            // questions without walking a history that grows with every comment.
            const listed = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: WORKFLOW, per_page: 100,
            });
            const runs = listed.data.workflow_runs || [];
            const startedAt = (r) => new Date(r.run_started_at || r.created_at).getTime();
            const hoursSince = (t) => (now.getTime() - t) / 3_600_000;

            // A run counts only if it executed a step. feedback.yml fires on every
            // `issue_comment` and skips at the job level, so unrelated comments and the
            // harness's own replies leave `completed`/`skipped` runs behind.
            const DEAD_CONCLUSIONS = ['skipped', 'cancelled', 'stale', 'startup_failure'];
            const executed = (r) =>
              r.status === 'in_progress' ||
              (r.status === 'completed' && !DEAD_CONCLUSIONS.includes(r.conclusion));
            // A pending run blocks another dispatch but does not count as a run. A dispatch can
            // sit `queued` for hours behind the `harness-ledger` lock, and dispatching over it
            // would cancel it.
            const pending = (r) => ['queued', 'requested', 'waiting', 'pending'].includes(r.status);

            const lastExecuted = runs.filter(executed).map(startedAt).sort((a, b) => b - a)[0];
            const somethingPending = runs.some(pending);
            const ageHours = lastExecuted ? hoursSince(lastExecuted) : Infinity;
            const ago = lastExecuted ? `${ageHours.toFixed(1)}h ago` : 'never';

            core.info(`last ${WORKFLOW} run that executed: ${ago}; pending: ${somethingPending}`);
            core.summary.addRaw(`Last \`${WORKFLOW}\` run that executed a step: **${ago}**.\n\n`);

            // ---- is the schedule alive? -------------------------------------------------
            // Checked on every tick, ahead of the staleness check below: a person who comments
            // because nothing answers leaves a run behind, which would otherwise hide a dead
            // schedule.
            const lastScheduled = runs
              .filter(r => r.event === 'schedule')
              .map(startedAt)
              .sort((a, b) => b - a)[0];

            // How many scheduled slots have come and gone since then. feedback's cron is
            // `41 */3 * * 1-5`: minute 41 of every third hour, Monday to Friday.
            const missedSlots = (since) => {
              if (!since) return Infinity;
              let n = 0;
              const t = new Date(since);
              t.setUTCMinutes(41, 0, 0);
              t.setUTCHours(t.getUTCHours() - (t.getUTCHours() % 3) + 3);
              while (t.getTime() <= now.getTime()) {
                if (weekday(t)) n += 1;
                t.setUTCHours(t.getUTCHours() + 3);
              }
              return n;
            };
            const missed = missedSlots(lastScheduled);
            const scheduledAgo = lastScheduled
              ? `${hoursSince(lastScheduled).toFixed(1)}h ago` : 'not in the last 100 runs';
            core.info(`last scheduled run ${scheduledAgo}; ${missed} weekday slot(s) missed`);
            core.summary.addRaw(
              `Last **scheduled** run: ${scheduledAgo} — ${missed} weekday slot(s) missed ` +
              `(a stoppage is ${DEAD_SLOTS}).\n\n`
            );

            // ---- should a run be started? ------------------------------------------------
            // The cron is `1-5`, so weekends have no slots to miss and nothing is dispatched
            // then; the docs say a Friday-evening comment waits for Monday.
            let dispatched = false;
            if (!weekday(now)) {
              core.summary.addRaw('Weekend: `feedback` is not scheduled, so nothing is missing.\n');
            } else if (somethingPending) {
              core.summary.addRaw('A run is already queued; dispatching over it would cancel it.\n');
            } else if (ageHours < STALE_HOURS) {
              core.summary.addRaw('Within threshold; nothing to start.\n');
            } else {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: WORKFLOW,
                ref: context.payload.repository.default_branch,
              });
              dispatched = true;
              core.warning(`no ${WORKFLOW} run has executed for ${ago}; dispatched one`);
              core.summary.addRaw('Past the threshold, so one was dispatched.\n');
            }
            await core.summary.write();

            if (missed < DEAD_SLOTS) return;

            // ---- the schedule has stopped ------------------------------------------------
            const title = 'ops: scheduled runs are not firing';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'kind:ops', per_page: 100,
            });
            const existing = open.find(i => !i.pull_request && i.title === title) || null;

            const body = [
              `## ${title}`,
              ``,
              `\`${WORKFLOW}\` has missed **${missed}** scheduled weekday slots since its last`
                + ` scheduled run (${scheduledAgo}).`
                + (dispatched
                  ? ` The watchdog dispatched a run just now.`
                  : ` The watchdog found a recent run, but not one started by the schedule.`),
              ``,
              `Usually GitHub dropped the schedule under load and nothing more is needed. If it`
                + ` keeps happening, check that the workflow is enabled on the Actions tab.`,
              ``,
              `GitHub disables every schedule on a public repository after 60 days without`
                + ` activity, this watchdog included; a missing weekly heartbeat comment on the`
                + ` tracking issue is the sign of that, and any push resets the clock.`,
              ``,
              `Until the schedule runs, comments on the product repository go unanswered;`
                + ` comments on the inbox issue are unaffected.`,
              ``,
              `_Close this once scheduled runs resume._`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              core.info(`updated ops issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['kind:ops'] });
              core.info(`opened ops issue #${created.data.number}`);
            }
