# ack.yml: acknowledge a /harness comment within seconds, before feedback.yml does the work.
# Separate from feedback.yml so it takes no lock and installs nothing. Spends nothing: no model
# call, no clone, no secret beyond GITHUB_TOKEN (B293).
name: ack

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Outside the `harness-ledger` group, since this job writes no state. Keyed per commenter: a
# per-comment key is unique every time and throttles nothing, while a per-commenter key makes one
# person's comments serialise, so they cannot fill the account's concurrent-job allowance.
concurrency:
  group: ack-${{ github.event.comment.user.login }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  ack:
    name: ack
    # Saves runner minutes only; `harness ack` applies trust and parsing with the sweep's code.
    # The second clause skips the harness's own comments, which name `/harness` commands and would
    # wake this workflow for ever. It tests the body's marker because this expression cannot read
    # `.harness/config.json` and the machine account is an ordinary user, not a `Bot` type.
    if: >-
      contains(github.event.comment.body, '/harness')
      && (!contains(github.event.comment.body, '<!-- bright-bots-harness -->')
          || contains(github.event.comment.body, '> <!-- bright-bots-harness -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write                # the acknowledgement comment and the eyes reaction
      pull-requests: write
    steps:
      - name: Checkout
        # `ref` is pinned: on `pull_request_review_comment` GitHub sets GITHUB_REF to
        # `refs/pull/N/merge`, so a bare checkout would run the pull request's `harness/` code,
        # including its trust parser.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Not installed: the harness is stdlib-only, so PYTHONPATH is enough. `ack` reads only
      # SELF_REPO, TRUST_FILE and the machine account, and at tier 0 cannot authenticate or spend.
      - name: Write a read-only .env
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          over = {
              "BACKEND": "fake",
              "PERMISSION_TIER": "0",
              "STORE_BACKEND": "sqlite",
              "SELF_REPO": "${{ github.repository }}",
              "TRUST_FILE": ".harness/trust.txt",
          }
          out = []
          for line in pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines():
              key = line.split("=", 1)[0].strip()
              out.append(f"{key}={over.pop(key)}" if key in over else line)
          out += [f"{k}={v}" for k, v in over.items()]
          pathlib.Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      # The body is untrusted and `${{ }}` is substituted before bash parses the line, so it
      # reaches python through the environment and is written to a file.
      - name: Capture the comment body
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python -c 'import os,pathlib; pathlib.Path("comment.txt").write_text(os.environ["COMMENT_BODY"], encoding="utf-8")'

      # `harness ack` decides whether to react and whether to comment as well. Every failure ends
      # in saying nothing, so the call cannot fail the step and the parse falls back to `{}`.
      - name: Decide what to say
        id: ack
        shell: bash
        env:
          PYTHONPATH: .
          ACTOR: ${{ github.event.comment.user.login }}
          # The numeric account id, which a `vouch:` line in trust.txt is pinned to (D68).
          ACTOR_ID: ${{ github.event.comment.user.id }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          python -m harness ack --body-file comment.txt --actor "$ACTOR" --actor-id "$ACTOR_ID" --association "$ASSOCIATION" --repo "${{ github.repository }}" --number "$NUMBER" > ack.json || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          try:
              d = json.loads(pathlib.Path("ack.json").read_text(encoding="utf-8") or "{}")
          except Exception:
              d = {}
          comment = str(d.get("comment") or "")
          pathlib.Path("ack.md").write_text(comment, encoding="utf-8")
          print("react=" + ("true" if d.get("react") else "false"))
          print("say=" + ("true" if comment.strip() else "false"))
          PY

      # Reacts whenever the harness will act, including fast verbs that get no comment.
      # `continue-on-error`, so a failed reaction never puts a red X on somebody's comment.
      - name: React
        if: steps.ack.outputs.react == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const id = context.payload.comment.id;
            const isReview = context.eventName === 'pull_request_review_comment';
            const fn = isReview
              ? github.rest.reactions.createForPullRequestReviewComment
              : github.rest.reactions.createForIssueComment;
            await fn({ owner, repo, comment_id: id, content: 'eyes' });

      # `continue-on-error` too: `issues.createComment` 403s on a locked issue, on a fork pull
      # request's read-only token and at GitHub's secondary content-creation limit.
      - name: Say it
        if: steps.ack.outputs.say == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const number = context.payload.issue?.number ?? context.payload.pull_request?.number;
            if (!number) { core.info('no issue or pull request number'); return; }
            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body: fs.readFileSync('ack.md', 'utf8').trim(),
            });
