# resume.yml: the relay that starts implement.yml or discover.yml at a given time (D95, D96).
# implement, discover and feedback arm it with the time `harness wake` gives: the run window's
# next opening, the end of a rate limit or of the session's usage stop, or an hour after a busy
# subscription; discover also arms it for the proposals a held triage run still owes. It sleeps
# in hops that fit a job's 120 minutes, then dispatches the workflow, which applies the halt, the
# usage stop, the quiet check and both gates again, and implement the window and the delivery
# cap too. Spends nothing, holds no secret and writes no state.
name: resume
# The title carries the workflow, the time and the chain, which is how one alarm sees another
# for the same workflow (below).
run-name: resume ${{ inputs.workflow }} at ${{ inputs.at }} ${{ inputs.origin }}

on:
  workflow_dispatch:
    inputs:
      at:
        description: "UTC time to start the workflow, e.g. 2026-10-14T01:30:00Z"
        required: true
      workflow:
        description: "what to start: implement.yml builds, discover.yml proposes (D96)"
        required: false
        default: implement.yml
        type: choice
        options: [implement.yml, discover.yml]
      reason:
        description: "why this time, as `harness wake` said it"
        required: false
        default: ""
      origin:
        description: "the first hop's run id; blank for a new alarm"
        required: false
        default: ""

# Outside the `harness-ledger` group: it writes no state, and a relay waiting in the group would
# hold the lock it is waiting to hand over. Alarms do not cancel each other; of those for one
# workflow the earliest stands, the oldest chain breaks a tie, and any other stops itself when it
# next checks.

jobs:
  relay:
    name: resume
    runs-on: ubuntu-latest
    timeout-minutes: 120          # B125: one hop sleeps at most 105 of them
    permissions:
      actions: write              # read run history; dispatch the workflow or the next hop
      contents: read              # read .harness/HALT
    steps:
      - name: HALT check (.harness/HALT on the default branch)
        id: halt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/contents/.harness/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" = "200" ]; then
            echo "halted by .harness/HALT; the alarm is dropped"
            echo "halted=true" >> "$GITHUB_OUTPUT"
          else
            echo "halted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sleep until the time, then start the workflow or the next hop
        if: steps.halt.outputs.halted != 'true'
        uses: actions/github-script@v7
        env:
          AT: ${{ inputs.at }}
          WORKFLOW: ${{ inputs.workflow }}
          REASON: ${{ inputs.reason }}
          ORIGIN: ${{ inputs.origin }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = (context.payload.repository || {}).default_branch || 'main';
            const at = Date.parse(process.env.AT || '');
            // A hop ends well inside the job's 120 minutes (B125).
            const HOP_MS = 105 * 60_000;
            // `harness wake` looks 24 hours ahead; anything further was not armed by it.
            const HORIZON_MS = 26 * 3_600_000;
            // An alarm this far past its time is stale: the next harness run arms a fresh one.
            const STALE_MS = 6 * 3_600_000;
            const LEDGER_WORKFLOWS = ['implement.yml', 'discover.yml', 'feedback.yml'];
            // What an alarm may start; a title without one is an implement alarm (D96).
            const TARGETS = ['implement.yml', 'discover.yml'];
            const target = process.env.WORKFLOW || 'implement.yml';
            const TITLE = /^resume\s+(?:(\S+\.yml)\s+)?at\s+(\S+)(?:\s+(\d+))?/;
            const ACTIVE = ['queued', 'requested', 'waiting', 'pending', 'in_progress'];
            const PENDING = ['queued', 'requested', 'waiting', 'pending'];
            const origin = Number(process.env.ORIGIN) || context.runId;
            const started = Date.now();
            const left = () => HOP_MS - (Date.now() - started);
            const sleep = (ms) => new Promise((done) => setTimeout(done, Math.max(0, ms)));

            if (!TARGETS.includes(target)) {
              core.setFailed(`not a workflow an alarm starts: ${JSON.stringify(target)}`);
              return;
            }
            if (Number.isNaN(at)) {
              core.setFailed(`not a time: ${JSON.stringify(process.env.AT)}`);
              return;
            }
            if (at - Date.now() > HORIZON_MS) {
              core.setFailed(`${process.env.AT} is more than 26 hours away; nothing armed it`);
              return;
            }
            if (Date.now() - at > STALE_MS) {
              core.info(`${process.env.AT} is more than six hours past; dropped as stale`);
              return;
            }

            // Of the alarms for this workflow the earliest stands, and of two at the same time the
            // older chain. A chain's hops share their origin, so a hop never stops for the one
            // that dispatched it.
            const earlierStands = async () => {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'resume.yml', per_page: 50,
              });
              return (data.workflow_runs || []).some((run) => {
                if (run.id === context.runId || !ACTIVE.includes(run.status)) return false;
                const title = TITLE.exec(String(run.display_title || ''));
                if (!title || (title[1] || 'implement.yml') !== target) return false;
                const other = Date.parse(title[2]);
                const chain = title[3] ? Number(title[3]) : run.id;
                return !Number.isNaN(other) && (other < at || (other === at && chain < origin));
              });
            };
            const nextHop = async () => {
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'resume.yml', ref,
                inputs: {
                  at: process.env.AT, workflow: target, reason: process.env.REASON || '',
                  origin: `${origin}`,
                },
              });
              core.info(`not yet ${process.env.AT}; the next hop is dispatched`);
            };
            // A run that waits in `harness-ledger`. feedback takes the lock at job level, so its
            // run reads in_progress while its job waits; that job is what a dispatch would replace.
            const waiting = async (workflow, run) => {
              if (PENDING.includes(run.status)) return true;
              if (workflow !== 'feedback.yml' || run.status !== 'in_progress') return false;
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner, repo, run_id: run.id,
              });
              return (data.jobs || []).some((job) => job.name === 'feedback'
                && PENDING.includes(job.status));
            };

            // A planning alarm lets a build alarm due at or before it dispatch first, so the two
            // never race for `harness-ledger` and the build keeps its head start (D96).
            const buildFirst = async () => {
              if (target !== 'discover.yml') return false;
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'resume.yml', per_page: 50,
              });
              return (data.workflow_runs || []).some((run) => {
                if (run.id === context.runId || !ACTIVE.includes(run.status)) return false;
                const title = TITLE.exec(String(run.display_title || ''));
                if (!title || (title[1] || 'implement.yml') !== 'implement.yml') return false;
                const other = Date.parse(title[2]);
                return !Number.isNaN(other) && other <= Date.now();
              });
            };

            if (await earlierStands()) {
              core.info('an earlier alarm stands; this one stops');
              return;
            }
            await sleep(Math.min(at - Date.now(), left()));
            if (Date.now() < at) {
              if (!(await earlierStands())) await nextHop();
              return;
            }

            // Due. A dispatch would replace a run already pending in `harness-ledger`, so it waits
            // for that run to start; a run of the workflow already queued or running plans for
            // itself.
            for (;;) {
              if (await earlierStands()) {
                core.info('an earlier alarm stands; this one stops');
                return;
              }
              const runs = [];
              for (const workflow of LEDGER_WORKFLOWS) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: workflow, per_page: 20,
                });
                for (const run of data.workflow_runs || []) runs.push({ workflow, run });
              }
              if (runs.some(({ workflow, run }) =>
                workflow === target && ACTIVE.includes(run.status))) {
                core.info(`a ${target} run is already queued or running; it plans for itself`);
                return;
              }
              let pending = await buildFirst();
              for (const { workflow, run } of runs) {
                if (pending) break;
                if (await waiting(workflow, run)) pending = true;
              }
              if (!pending) break;
              if (left() < 5 * 60_000) {
                await nextHop();
                return;
              }
              core.info('a ledger run or a due build alarm is ahead; waiting two minutes');
              await sleep(2 * 60_000);
            }
            // discover.yml starts in triage, its schedule's mode, so it waits for a quiet
            // subscription and proposes the queue (D96).
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: target, ref,
            });
            core.info(`${target} dispatched (${process.env.REASON || 'no reason given'})`);
            await core.summary
              .addRaw(`Started \`${target}\` at ${new Date().toISOString()} `)
              .addRaw(`for the alarm set for ${process.env.AT}.\n`)
              .write();
