# ops.yml: when a spending run fails, open or update its ops issue and retry a transient failure
# up to twice; when it succeeds, close its ops issue. Spends nothing (B145).
# The harness package may not shell out to `gh`; this workflow uses actions/github-script.
name: ops

on:
  workflow_run:
    workflows: [discover, implement, feedback]
    types: [completed]

env:
  PYTHONUTF8: "1"

jobs:
  # A green run of a workflow closes that workflow's open ops issue.
  recovered:
    name: ops recovered
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Close the ops issue for a workflow that is green again
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const title = `ops: ${run.name} failed`;

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'kind:ops', per_page: 100,
            });
            const stale = open.filter(i => !i.pull_request && i.title === title);
            if (stale.length === 0) {
              core.info(`no open ops issue titled ${JSON.stringify(title)}`);
              return;
            }

            for (const issue of stale) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  `Closed: **${run.name}** succeeded in ${run.html_url}`
                    + ` (event \`${run.event}\`, sha \`${run.head_sha}\`).`,
                  ``,
                  `Reopen if the failure needs a diagnosis; the next failure opens a new issue.`,
                ].join('\n'),
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
              core.info(`closed ops issue #${issue.number}`);
            }

  triage:
    name: ops triage
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 120          # B125
    permissions:
      contents: read
      issues: write               # the ops issue and its comments/labels
      actions: write              # read jobs and logs of the failed run; re-run failed jobs
    steps:
      - name: Alert and bounded retry
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const wfName = run.name;
            const attempt = run.run_attempt || 1;

            // Three attempts, so two retries: network and registry blips cluster, and a single
            // retry often lands in the same bad minute. Counted from `run_attempt`, which GitHub
            // increments per run, so the cap applies to each run on its own.
            const MAX_ATTEMPTS = 3;

            // --- what failed -------------------------------------------------------------
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const failedJob =
              jobs.find(j => j.conclusion === 'failure') ||
              jobs.find(j => j.conclusion && !['success', 'skipped', 'neutral'].includes(j.conclusion)) ||
              null;
            let failingStep = '(none identified)';
            if (failedJob) {
              const s = (failedJob.steps || []).find(st => st.conclusion === 'failure');
              if (s) failingStep = s.name;
            }

            // --- last 50 log lines, and the harness's own error lines, redacted -----------
            const redact = (line) => line
              .replace(/gh[pousr]_[A-Za-z0-9]{20,}/g, '[REDACTED:token]')
              .replace(/github_pat_[A-Za-z0-9_]{20,}/g, '[REDACTED:token]')
              .replace(/sk-ant-[A-Za-z0-9_\-]{20,}/g, '[REDACTED:key]')
              .replace(/(Authorization\s*:\s*)(Bearer|token|Basic)\s+\S+/gi, '$1$2 [REDACTED]')
              .replace(/(https?:\/\/)[^\/\s:@]+:[^@\s]+@/g, '$1[REDACTED]@')
              .replace(/([A-Z0-9_]*(TOKEN|SECRET|PASSWORD|API_KEY)[A-Z0-9_]*\s*=\s*)\S+/g, '$1[REDACTED]');
            // Besides the tail, carry every line in the harness's error forms, wherever it fell:
            // `error:`, `::error::`, `##[error]`, `rate limited` and `budget exhausted`. The
            // script listing under each `##[group]Run ...` is skipped, because it quotes every
            // `echo "::error::..."` in the step whether or not it ran (B401).
            const ERROR_LINE_RE = /(^|\s)error:|##\[error\]|::error::|rate limited|budget exhausted/i;
            const ERROR_LINES_MAX = 20;
            const ERROR_LINE_CHARS = 500;
            let tail = '(log unavailable)';
            let errorLines = '(log unavailable)';
            if (failedJob) {
              try {
                const r = await github.rest.actions.downloadJobLogsForWorkflowRun({ owner, repo, job_id: failedJob.id });
                const text = typeof r.data === 'string' ? r.data : Buffer.from(r.data).toString('utf8');
                const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
                tail = lines.slice(-50).map(redact).join('\n');
                const found = [];
                let inListing = false;
                for (const line of lines) {
                  const body = line.replace(/^\d{4}-\d{2}-\d{2}T\S*Z\s/, '');
                  if (body.startsWith('##[group]Run ')) { inListing = true; continue; }
                  if (inListing) {
                    if (body.startsWith('##[endgroup]')) inListing = false;
                    continue;
                  }
                  if (ERROR_LINE_RE.test(body)) found.push(redact(body).slice(0, ERROR_LINE_CHARS));
                }
                errorLines = found.length
                  ? found.slice(-ERROR_LINES_MAX).join('\n')
                  : '(no line in the harness error forms)';
              } catch (e) {
                tail = `(log unavailable: ${e.message})`;
                errorLines = tail;
              }
            }

            // --- classification (B146) ---------------------------------------------------
            // `reRunWorkflowRunFailedJobs` re-runs the whole job, and each spending workflow is
            // one job, so only a failure in a step listed here, all of which run before anything
            // is spent, is retried. Model calls (propose, revise), gates and every later step,
            // the ledger commit included, are left for a human. A test classifies every step.
            const RETRYABLE_STEPS = [
              'HALT check (.harness/HALT on the default branch)',
              'Checkout',
              'Load state/ledger.json from harness-state',
              'Set up Python 3.13',
              'Set up Node',
              'Install harness and the claude CLI',
              'Write .env from .env.example and repository configuration',
              'harness doctor',
              'harness sync-fork',
              'Note a stale fork',
              'Approve merged proposals (push to proposals/**)',
              'harness dispatch',
            ];
            const preSpend = RETRYABLE_STEPS.includes(failingStep);
            const modelOrGate = !preSpend;
            const transientRe = new RegExp([
              'ECONNRESET', 'ETIMEDOUT', 'EAI_AGAIN', 'ENOTFOUND', 'socket hang up',
              'npm ERR! (network|fetch|ERR_SOCKET|E5\\d\\d)', 'registry\\.npmjs\\.org.*\\b5\\d\\d\\b',
              'Internal Server Error', 'Bad Gateway', 'Service Unavailable', 'Gateway Time-?out',
              'HTTP(S)?\\s*5\\d\\d', 'status(:| code)?\\s*5\\d\\d',
              'received a shutdown signal', 'lost communication with the server', 'runner has been evicted',
              'Connection reset by peer', 'TLS handshake timeout', 'Could not resolve host',
              'Temporary failure in name resolution',
            ].join('|'), 'i');
            const transient = !modelOrGate && transientRe.test(tail);

            // --- the ops issue: open or update ------------------------------------------
            const title = `ops: ${wfName} failed`;
            const ensureLabel = async (name, color, description) => {
              try { await github.rest.issues.getLabel({ owner, repo, name }); }
              catch (e) { if (e.status === 404) await github.rest.issues.createLabel({ owner, repo, name, color, description }); else throw e; }
            };
            // Colour and description match LABEL_SPECS, which `harness init --labels` uses (B264).
            await ensureLabel('kind:ops', 'e11d21', 'a failed run');
            // `ensureLabel` only creates a missing label; an existing one keeps its description.
            await ensureLabel('retried', 'fbca04', 'harness: automatically retried at least once');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'kind:ops', per_page: 100,
            });
            let issue = open.find(i => !i.pull_request && i.title === title) || null;
            // The `retried` label only tells readers of the issue list; the cap is `run_attempt`.
            const alreadyRetried = !!(issue && issue.labels.some(l => (l.name || l) === 'retried'));

            const willRetry = transient && attempt < MAX_ATTEMPTS;

            let action;
            if (willRetry) {
              action = `transient failure on attempt ${attempt} of ${MAX_ATTEMPTS}: re-dispatching the failed jobs (attempt ${attempt + 1}).`;
            } else if (transient) {
              action = `transient failure on attempt ${attempt}: ${MAX_ATTEMPTS} attempts is the cap; left for a human.`;
            } else if (modelOrGate) {
              action = `failed in "${failingStep}", which may run after spending; `
                + 'not retried, left for a human.';
            } else {
              action = 'not classified as transient: left for a human.';
            }

            const body = [
              `## ${title}`,
              ``,
              `- run: ${run.html_url} (attempt ${attempt}, event \`${run.event}\`, branch \`${run.head_branch}\`, sha \`${run.head_sha}\`)`,
              `- failing job: ${failedJob ? `${failedJob.name} (${failedJob.html_url})` : '(none identified)'}`,
              `- failing step: ${failingStep}`,
              `- classification: ${transient ? 'transient' : 'not transient'}`,
              `- failing step runs before any spend: ${preSpend ? 'yes' : 'no'}`,
              `- attempts: ${attempt} of ${MAX_ATTEMPTS}${alreadyRetried ? ' (this issue has seen a retry before)' : ''}`,
              `- action: ${action}`,
              ``,
              `<details open><summary>error lines (redacted, the last ${ERROR_LINES_MAX} in the harness error forms)</summary>`,
              ``,
              '```',
              errorLines,
              '```',
              `</details>`,
              ``,
              `<details><summary>last 50 log lines (redacted)</summary>`,
              ``,
              '```',
              tail,
              '```',
              `</details>`,
              ``,
              `_See docs/OPERATIONS.md. Close this issue once handled; the next failure opens a fresh one._`,
            ].join('\n');

            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
              core.info(`updated ops issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['kind:ops'] });
              issue = created.data;
              core.info(`opened ops issue #${issue.number}`);
            }

            // --- bounded retry (B146) ---------------------------------------------------
            if (willRetry) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['retried'] });
              await github.rest.actions.reRunWorkflowRunFailedJobs({ owner, repo, run_id: run.id });
              core.info(`re-dispatched failed jobs of run ${run.id} (attempt ${attempt + 1} of ${MAX_ATTEMPTS})`);
            }
