# feedback.yml: every 3h on weekdays and on /harness comments here, sweep notifications and
# keywords, queue assigned issues and reconcile stranded items. Step order: HALT check,
# checkout/setup, doctor, sync-fork, dispatch, work, ledger, artifacts.
name: feedback

on:
  schedule:
    - cron: "41 */3 * * 1-5"      # B124: non-zero, non-round minute
  workflow_dispatch: {}
  # On this repository, /harness commands are event-driven and act within the same run (B134).
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Every workflow that writes state/ledger.json shares one group and never cancels a run (B118).
concurrency:
  group: harness-ledger
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  feedback:
    name: feedback
    # Comment events wake the job only for a command, to save runner minutes; trust and parsing
    # happen in harness/keywords.py. `contains()` is case-insensitive, so `/Harness` gets through.
    # Naming the bot is the other command form (B435/B437), and it has to be named here as well as
    # in the parser: a job condition is evaluated before any step, so the run is skipped entirely
    # and no parser is ever reached. The handle is hard-coded because this expression cannot read
    # `.harness/config.json`; a drift test pins it to the owner of FORK_REPO.
    # The last clause skips the harness's own replies, which name `/harness` commands;
    # it tests the marker because this expression cannot read the machine login from config.
    if: >-
      (github.event_name != 'issue_comment' && github.event_name != 'pull_request_review_comment')
      || ((contains(github.event.comment.body, '/harness')
           || contains(github.event.comment.body, '@jgoetzmann-bot'))
          && (!contains(github.event.comment.body, '<!-- bright-bots-harness -->')
              || contains(github.event.comment.body, '> <!-- bright-bots-harness -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 120          # B125
    permissions:
      contents: write             # read .harness/HALT; push the ledger commit. Issue/PR writes use the machine account's PAT via .env, never this token.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # B128: sweep actions (revise/propose) may call the model
    steps:
        # The first step of every spending job, before checkout, doctor and the dispatcher (B149).
      - name: HALT check (.harness/HALT on the default branch)
        id: halt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          mkdir -p .harness
          code="$(curl -sS -o .harness/HALT -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/${REPO}/contents/.harness/HALT?ref=${REF}" || echo 000)"
          if [ "${code}" != "200" ]; then rm -f .harness/HALT; fi
          if test -f .harness/HALT; then
            echo "halted by .harness/HALT"
            echo "halted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "halted=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.halt.outputs.halted != 'true'
        # `ref` is pinned: on `pull_request_review_comment` GitHub sets GITHUB_REF to
        # `refs/pull/N/merge`, so a bare checkout would run the pull request's `harness/` code
        # beside the machine account's PAT, which this job writes into `.env`.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

        # The ledger lives on the unprotected `harness-state` branch, because main requires a
        # reviewed PR and the Actions token commits directly (D28).
      - name: Load state/ledger.json from harness-state
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git fetch --quiet origin harness-state 2>/dev/null; then
            mkdir -p state
            git show FETCH_HEAD:state/ledger.json > state/ledger.json
            echo "ledger loaded from harness-state"
          else
            echo "no harness-state branch yet; using the checked-in ledger"
          fi

      - name: Set up Python 3.13
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        if: steps.halt.outputs.halted != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install harness and the claude CLI
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          python -m pip install -e .
          npm i -g @anthropic-ai/claude-code
          claude --version

      - name: Write .env from .env.example and repository configuration
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        env:
          HARNESS_GITHUB_TOKEN: ${{ secrets.HARNESS_GITHUB_TOKEN }}
          FORK_REPO: ${{ vars.FORK_REPO }}
          SELF_REPO: ${{ github.repository }}
          TRACKING_ISSUE: ${{ vars.TRACKING_ISSUE }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          src = pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines()
          env = os.environ
          over = {
              "BACKEND": "cli",
              "PERMISSION_TIER": "2",
              "STORE_BACKEND": "github",
              "HARNESS_GITHUB_TOKEN": env.get("HARNESS_GITHUB_TOKEN", ""),
              "FORK_REPO": env.get("FORK_REPO", ""),
              "SELF_REPO": env.get("SELF_REPO", ""),
              "TRACKING_ISSUE": env.get("TRACKING_ISSUE", ""),
              "ANTHROPIC_API_KEY": "",
          }
          out, seen = [], set()
          for line in src:
              m = re.match(r"^([A-Z0-9_]+)=", line)
              if m and m.group(1) in over:
                  out.append(f"{m.group(1)}={over[m.group(1)]}")
                  seen.add(m.group(1))
              else:
                  out.append(line)
          for k, v in over.items():
              if k not in seen:
                  out.append(f"{k}={v}")
          pathlib.Path(".env").write_text("\n".join(out) + "\n", encoding="utf-8")
          # Repository variables fill .harness/config.json only where the committed file leaves a knob empty.
          cfg_path = pathlib.Path(".harness/config.json")
          if cfg_path.exists():
              cfg = json.loads(cfg_path.read_text(encoding="utf-8"))
              changed = False
              if not cfg.get("FORK_REPO") and over["FORK_REPO"]:
                  cfg["FORK_REPO"] = over["FORK_REPO"]
                  changed = True
              if cfg.get("TRACKING_ISSUE") in (None, "") and over["TRACKING_ISSUE"]:
                  cfg["TRACKING_ISSUE"] = int(over["TRACKING_ISSUE"])
                  changed = True
              if changed:
                  cfg_path.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          keys = [m.group(1) for m in (re.match(r"^([A-Z0-9_]+)=", l) for l in out) if m]
          print(".env written; keys:", " ".join(keys))
          PY

        # B127: verify the environment before spending anything.
      - name: harness doctor
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: harness doctor

        # Fast-forward only; a diverged fork pushes nothing (B105). A failure here is not fatal:
        # it skips implementing this run, while dispatch, the sweep and the assigned-issue queue
        # still run. Remaining causes are transient, or a token missing the `workflow` scope,
        # which doctor names.
      - name: harness sync-fork
        id: syncfork
        if: steps.halt.outputs.halted != 'true'
        continue-on-error: true
        shell: bash
        run: harness sync-fork

      - name: Note a stale fork
        if: steps.syncfork.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=fork not synced::harness sync-fork failed, so the fork is behind \
          upstream. Reading routes (sweep, ask, usage) still work; implementing is skipped this \
          run, because a clone of a stale fork would silently base the work on the wrong commit."

        # Printed for the record; the sweep and the reconciler apply their own rules (B122).
      - name: harness dispatch
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          mkdir -p runs
          harness dispatch | tee runs/dispatch-plan.json

        # One notifications call since the ledger cursor; keywords are authorised before they are
        # parsed, and acted on at most once (B135). The sweep spends nothing itself; the revise
        # and propose actions it enqueues are admitted by their stages.
      - name: Sweep keywords (harness sweep; may run revise/propose)
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          harness sweep | tee runs/sweep.jsonl

        # A maintainer hands the harness a ticket by assigning the machine account to a product
        # issue. No events arrive from that repository, so this polls: one request, no model
        # call. An issue that is already a work item is left alone (B233).
      - name: Queue issues assigned to the bot (harness discover --mode assigned)
        if: steps.halt.outputs.halted != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          if harness --json discover --mode assigned | tee runs/assigned.json; then
            echo "assigned sweep ok"
          else
            status=$?
            # A budget stop is a normal outcome, and this step spends nothing anyway (B120).
            if [ "${status}" -eq 4 ]; then
              echo "budget exhausted; nothing queued this run"
            else
              echo "::error::harness discover --mode assigned exited ${status}"
              exit "${status}"
            fi
          fi

        # Reconciliation runs at the entry of `harness run`: items left building, revising or
        # proposing with no live workflow run for 3 hours go back to their previous label (B147).
        # Skipped when the fork is stale, since implementing would base the work on a commit that
        # is not upstream's HEAD.
      - name: Reconcile stale harness:running items (harness run)
        if: steps.halt.outputs.halted != 'true' && steps.syncfork.outcome == 'success'
        shell: bash
        run: harness run

        # Rewrites the queue between the markers on the pinned tracking issue, and once a week
        # deletes the harness's own oldest comments there and on the inbox (D76). Spends nothing:
        # no model call, no clone. `continue-on-error`, because failing to publish a summary must
        # not red a run that did its work. It runs before the ledger commit, so the prune cursor
        # it moves is what gets committed.
      - name: Publish the queue and prune old comments (harness tidy)
        if: steps.halt.outputs.halted != 'true'
        continue-on-error: true
        shell: bash
        run: harness tidy

        # Commits the ledger with [skip ci]; runs even when a step failed, never when halted.
      - name: Commit state/ledger.json
        if: always() && steps.halt.outputs.halted != 'true'
        shell: bash
        env:
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: harness-state
        run: |
          set -euo pipefail
          if [ ! -f state/ledger.json ]; then echo "no ledger file; nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A worktree holding only the state branch, so main's history never rides along (D28).
          rm -rf ../harness-state
          if git fetch --quiet origin "${BRANCH}" 2>/dev/null; then
            git worktree add --quiet ../harness-state FETCH_HEAD
          else
            git worktree add --quiet --orphan -b "${BRANCH}" ../harness-state
          fi
          mkdir -p ../harness-state/state
          if [ -f ../harness-state/state/ledger.json ] && cmp -s state/ledger.json ../harness-state/state/ledger.json; then
            echo "ledger unchanged; nothing to commit"
            exit 0
          fi
          cp state/ledger.json ../harness-state/state/ledger.json
          cd ../harness-state
          git add state/ledger.json && git commit --quiet -m "ledger: ${WORKFLOW} run ${RUN_ID} [skip ci]"
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:refs/heads/${BRANCH}"; then echo "ledger pushed to ${BRANCH}"; exit 0; fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${BRANCH}"
            git fetch --quiet origin "${BRANCH}"
            if ! git rebase --quiet "origin/${BRANCH}"; then
              git rebase --abort || true
              echo "::error::ledger rebase conflicted; run 'harness ledger --rebuild' and commit the result by hand (B117)"
              exit 1
            fi
          done
          echo "::error::could not push the ledger after 3 attempts"
          exit 1

        # B126: evidence survives a cancelled or timed-out run.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            runs/item-*/
            runs/dispatch-plan.json
            runs/sweep.jsonl
            runs/**/*.md
            runs/**/*.json
            runs/**/*.jsonl
            runs/**/*.log
            runs/**/*.txt
            !runs/**/node_modules/**
            !runs/**/.git/**
            !runs/**/clone/**
            !runs/**/workspace/**
